spring:
  application:
    name: system

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

  datasource:
    url: jdbc:h2:mem:resenhagram_db
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-dev-secret-dev-secret-dev-secret}
    expiration-seconds: 900

server:
  port: 8081

APPS_SCRIPT_API_URL: ${APPS_SCRIPT_API_URL:}
APPS_SCRIPT_API_SECRET: ${APPS_SCRIPT_API_SECRET:}
FRONTEND_URL: ${FRONTEND_URL:http://localhost:4200}
CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}