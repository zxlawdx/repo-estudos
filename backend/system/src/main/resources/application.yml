spring:
  application:
    name: system

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

  datasource:
    url: jdbc:h2:mem:resenhagram_db
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-dev-secret-dev-secret-dev-secret}
    expiration-seconds: 900

server:
  port: 8081