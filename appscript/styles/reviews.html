<style>
/* ============================================================
   Resenhas e Comentários — v22
   Cards mais limpos, dark mode real e estado ativo de like/salvo.
   ============================================================ */
.reviews-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 18px;
  align-items: start;
}
.reviews-feed { display: flex; flex-direction: column; gap: 16px; }
.reviews-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
}
.reviews-tabs {
  display: flex; gap: 8px; overflow-x: auto;
  padding: 0 0 8px; margin-bottom: 14px;
}
.review-tab {
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  color: var(--text-secondary);
  border-radius: 999px;
  padding: 8px 13px;
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
  cursor: pointer;
  transition: background .15s ease, color .15s ease, border-color .15s ease, transform .15s ease;
}
.review-tab:hover { border-color: var(--primary-dim); color: var(--primary); transform: translateY(-1px); }
.review-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: var(--shadow-sm); }

/* Cards do feed de resenhas */
.reviews-feed > .review-card,
.review-detail-sheet .review-card {
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--surface) 96%, var(--primary) 4%) 0%, var(--surface) 100%);
  border: 1px solid color-mix(in srgb, var(--border) 82%, var(--primary) 18%);
  border-radius: 20px;
  padding: 18px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  overflow: hidden;
}
.reviews-feed > .review-card:hover {
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--primary) 55%, var(--border) 45%);
}
.review-card-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 11px; }
.review-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--surface-low);
  border: 1px solid color-mix(in srgb, var(--border) 72%, var(--primary) 28%);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; flex-shrink: 0;
  color: var(--primary);
  box-shadow: var(--shadow-xs);
}
.review-avatar img { width: 100%; height: 100%; object-fit: cover; }
.review-avatar .material-symbols-outlined { font-size: 26px; }
.review-card-title {
  font-size: 18px; font-weight: 900; color: var(--text-primary);
  margin: 10px 0 7px; line-height: 1.25; letter-spacing: -.02em;
}
.review-card-body {
  font-size: 14px; line-height: 1.6; color: var(--text-secondary);
  white-space: pre-wrap;
}
.review-material-card {
  display: flex; gap: 12px; align-items: center;
  background: color-mix(in srgb, var(--surface-low) 88%, var(--primary) 12%);
  border: 1px solid color-mix(in srgb, var(--border) 74%, var(--primary) 26%);
  border-radius: 16px;
  padding: 12px;
  margin: 14px 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
}
.review-material-icon {
  width: 46px; height: 54px; border-radius: 12px;
  background: var(--primary-container);
  color: var(--on-primary-container);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: var(--shadow-xs);
}
.review-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 11px 0; }
.review-tag {
  font-size: 11px; font-weight: 800;
  background: var(--surface-low);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-secondary);
  padding: 4px 9px;
}
.review-actions {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; flex-wrap: wrap;
  border-top: 1px solid var(--border);
  margin-top: 13px; padding-top: 11px;
}
.review-action-group { display: flex; gap: 8px; flex-wrap: wrap; }
.review-action {
  border: 0; background: transparent; color: var(--text-muted);
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 800;
  padding: 7px 10px; border-radius: 999px;
  cursor: pointer;
  transition: background .15s ease, color .15s ease, transform .15s ease;
}
.review-action:hover { background: var(--surface-low); color: var(--primary); transform: translateY(-1px); }
.review-action.active,
.review-action.is-active {
  color: var(--primary);
  background: color-mix(in srgb, var(--primary-container) 72%, transparent);
  font-weight: 900;
}
.review-action.active .material-symbols-outlined,
.review-action.is-active .material-symbols-outlined {
  color: var(--primary);
  font-variation-settings: 'FILL' 1, 'wght' 750, 'GRAD' 0, 'opsz' 24;
}
.reviews-side {
  position: sticky; top: 80px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.review-filter-group { display: flex; flex-direction: column; gap: 7px; margin: 13px 0; }
.review-filter-group label { font-size: 11px; color: var(--text-muted); font-weight: 900; text-transform: uppercase; letter-spacing: .06em; }
.review-empty {
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: 20px;
  padding: 30px;
  text-align: center;
  color: var(--text-muted);
}
.review-empty .material-symbols-outlined { font-size: 42px; color: var(--primary); margin-bottom: 8px; }
.review-modal-grid { display: grid; grid-template-columns: 1fr 270px; gap: 14px; }
.review-composer-textarea { min-height: 220px; resize: vertical; }
.review-detail-comments { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.review-comment {
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface-low);
  padding: 13px;
}
.review-comment.child { margin-left: 28px; }
.review-rating { display: inline-flex; align-items: center; gap: 3px; color: var(--tertiary); font-weight: 900; }
.reviews-fab {
  display: none; position: fixed; right: 18px; bottom: 82px; z-index: 50;
  border: 0; background: var(--primary); color: #fff; border-radius: 999px;
  width: 56px; height: 56px; box-shadow: 0 10px 30px rgba(0,74,198,.3);
  align-items: center; justify-content: center;
}
.reviews-fab .material-symbols-outlined { font-size: 28px; }
.review-detail-sheet {
  position: fixed; right: 0; top: 0; bottom: 0;
  width: min(680px, 100vw);
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: -8px 0 30px rgba(0,0,0,.18);
  z-index: 80; display: none; overflow: auto;
}
.review-detail-sheet.open { display: block; }
.review-detail-sheet-inner { padding: 22px; }
.review-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 79; }
.review-backdrop.open { display: block; }

/* Dark mode específico */
html.dark .reviews-feed > .review-card,
html.dark .review-detail-sheet .review-card {
  background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 92%, var(--primary) 8%) 0%, var(--surface) 100%);
  border-color: color-mix(in srgb, var(--border) 70%, var(--primary) 30%);
}
html.dark .review-material-card {
  background: color-mix(in srgb, var(--surface-low) 86%, var(--primary) 14%);
  border-color: color-mix(in srgb, var(--border) 72%, var(--primary) 28%);
}
html.dark .review-tag,
html.dark .review-comment { background: var(--surface-low); }
html.dark .reviews-side,
html.dark .review-detail-sheet,
html.dark .review-empty { background: var(--surface); }

@media (max-width: 1100px) {
  .reviews-layout { grid-template-columns: 1fr; }
  .reviews-side { position: static; display: none; }
  .reviews-side.open { display: block; }
}
@media (max-width: 768px) {
  .reviews-toolbar { align-items: flex-start; }
  .reviews-toolbar .btn-primary, .reviews-toolbar .btn-secondary { width: 100%; justify-content: center; }
  .reviews-feed > .review-card { padding: 14px; border-radius: 18px; }
  .review-card-head { gap: 10px; }
  .review-avatar { width: 38px; height: 38px; }
  .review-card-title { font-size: 16px; }
  .review-card-body { font-size: 13px; }
  .review-actions { align-items: flex-start; }
  .review-action-group { width: 100%; justify-content: space-between; }
  .review-material-card { align-items: flex-start; }
  .review-modal-grid { grid-template-columns: 1fr; }
  .reviews-fab { display: flex; }
  .review-detail-sheet { left: 0; right: 0; top: auto; height: 88dvh; border-left: 0; border-radius: 20px 20px 0 0; }
  .review-detail-sheet-inner { padding: 16px; padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
  .review-comment.child { margin-left: 14px; }
}
</style>
