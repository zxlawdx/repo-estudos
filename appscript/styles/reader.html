<style>
/* ============================================================
   Leitor + YouTube/link externo · mobile-first
   ============================================================ */
.external-link-card{background:#fff;border:1px solid #c3c6d7;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.external-link-hero{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;padding:16px;align-items:center}
.external-link-thumb{width:100%;aspect-ratio:16/9;border-radius:14px;background:#f2f4f6;object-fit:cover;border:1px solid #dfe3eb}
.external-link-thumb.placeholder{display:flex;align-items:center;justify-content:center;color:#737686}
.youtube-frame-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#111;border-radius:0;overflow:hidden}
.youtube-frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.reader-shell{min-height:100dvh;background:linear-gradient(180deg,#f7f9fb 0%,#eef3ff 100%);display:flex;flex-direction:column}
.reader-topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid #c3c6d7;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.reader-title{flex:1;min-width:180px;font-size:14px;font-weight:800;color:#191c1e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reader-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;min-height:0}
.reader-page{width:min(100%,1120px);height:min(74dvh,780px);background:#202124;border-radius:20px;box-shadow:0 18px 60px rgba(0,0,0,.18);overflow:hidden;position:relative;touch-action:pan-y}
.reader-page iframe{width:100%;height:100%;border:0;background:white;transform-origin:center center}
.reader-bottom{position:sticky;bottom:0;z-index:35;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid #c3c6d7;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.reader-page-pill{background:#dbe1ff;color:#003ea8;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:800}
.reader-error{max-width:860px;margin:24px auto;background:#fff7f6;border:1px solid #ffb4ab;border-radius:18px;padding:18px;color:#93000a}
.link-preview-panel{display:none;background:#fff;border:1px solid #c3c6d7;border-radius:16px;padding:14px;margin-top:12px}
.link-preview-panel.active{display:block}
@media(max-width:700px){
  .external-link-hero{grid-template-columns:1fr;padding:12px}.external-link-card{border-radius:16px}
  .reader-topbar{gap:8px}.reader-title{order:3;flex-basis:100%;font-size:13px}.reader-controls{width:100%;justify-content:space-between}.reader-controls .btn-secondary,.reader-controls .btn-primary{flex:1;justify-content:center}
  .reader-stage{padding:10px}.reader-page{height:68dvh;border-radius:16px}.reader-bottom .btn-secondary,.reader-bottom .btn-primary{min-height:44px}.reader-page-pill{order:-1;width:100%;text-align:center}
}
</style>
