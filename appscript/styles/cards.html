<style>
/* ============================================================
   CARDS — Estilo Stitch v18
   Biblioteca · Upload · Revisão · Categorias · Trilhas
   ============================================================ */

/* ── File Card ── */
.file-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px;
  display: flex; flex-direction: column; gap: 12px; min-width: 0;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow var(--transition-base), border-color var(--transition-base);
  cursor: pointer;
}
.file-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--primary-dim);
}
.file-card-header  { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; min-width: 0; }
.file-card-badges  { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.file-card-title   { font-size: 16px; font-weight: 700; color: var(--text-primary); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; letter-spacing: -.01em; }
.file-card-subtitle{ font-size: 13px; color: var(--text-muted); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-card-meta    { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.file-meta-item label { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 2px; }
.file-meta-item span  { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.file-card-tags    { display: flex; flex-wrap: wrap; gap: 4px; }
.file-card-actions { display: flex; gap: 8px; margin-top: auto; }

/* ── Folder Card (Categorias — estilo Stitch bento) ── */
.folder-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden; cursor: pointer;
  transition: transform .2s cubic-bezier(.4,0,.2,1), box-shadow var(--transition-base), border-color var(--transition-base);
}
.folder-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-xl);
  border-color: var(--primary-dim);
}
.folder-card-top {
  padding: 16px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: flex-start;
}
.folder-icon {
  width: 46px; height: 46px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  transition: transform var(--transition-base);
}
.folder-card:hover .folder-icon { transform: scale(1.1); }
.folder-card-body { padding: 16px; }
.folder-card-title { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; letter-spacing: -.01em; transition: color var(--transition-fast); }
.folder-card:hover .folder-card-title { color: var(--primary); }
.folder-card-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.4; }
/* Contagem de arquivos — badge do Stitch */
.folder-count-badge {
  font-size: 11px; font-weight: 700;
  padding: 3px 8px; border-radius: var(--radius-sm);
  background: var(--surface-high); color: var(--text-muted);
}

/* ── Bento Grid ── */
.bento-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px,100%),1fr)); gap: 18px; }
@media (max-width: 640px) { .bento-grid { gap: 12px; } }

/* ── Buttons ── */
.btn-primary {
  background: var(--primary); color: #ffffff !important;
  border: none; border-radius: var(--radius-md); padding: 10px 18px;
  font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: opacity var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
  -webkit-tap-highlight-color: transparent;
}
.btn-primary:hover  { opacity: .88; box-shadow: var(--shadow-sm); }
.btn-primary:active { transform: scale(.97); }

.btn-secondary {
  background: var(--surface); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: var(--radius-md); padding: 9px 14px;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background var(--transition-fast), border-color var(--transition-fast);
  -webkit-tap-highlight-color: transparent;
}
.btn-secondary:hover  { background: var(--surface-low); border-color: var(--border-strong); color: var(--text-primary); }
.btn-secondary:active { transform: scale(.97); }

.btn-danger {
  background: transparent; color: var(--error);
  border: 1px solid var(--error-container); border-radius: var(--radius-md); padding: 9px 14px;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background var(--transition-fast);
}
.btn-danger:hover { background: var(--error-container); border-color: var(--error); }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 9px; border-radius: var(--radius-full);
  font-size: 10px; font-weight: 800; letter-spacing: .05em;
  text-transform: uppercase; white-space: nowrap;
}
.badge-approved  { background: var(--success-container);    color: var(--success); }
.badge-pending   { background: var(--warning-container);    color: var(--on-warning-container); }
.badge-rejected  { background: var(--error-container);      color: var(--on-error-container); }
.badge-archived  { background: var(--surface-high);         color: var(--text-secondary); }
.badge-primary   { background: var(--primary-container);    color: var(--on-primary-container); }
.badge-secondary { background: var(--secondary-container);  color: var(--on-secondary-container); }
.badge-tertiary  { background: var(--tertiary-container);   color: var(--on-tertiary-container); }

/* ── Form controls ── */
.form-control {
  width: 100%; min-height: 44px;
  background: var(--input-bg); color: var(--input-text);
  border: 1px solid var(--input-border); border-radius: var(--radius-md);
  padding: 9px 14px; font-size: 14px; font-family: inherit; outline: none;
  transition: box-shadow var(--transition-fast), border-color var(--transition-fast), background var(--transition-fast);
}
.form-control::placeholder { color: var(--input-placeholder); }
.form-control:focus { box-shadow: 0 0 0 2px var(--primary); border-color: var(--primary); background: var(--surface); }
textarea.form-control { resize: vertical; min-height: 88px; }
select.form-control   { appearance: auto; cursor: pointer; }

.filter-select { display: flex; flex-direction: column; gap: 5px; }
.filter-select label, .filter-select > span {
  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted);
}

/* ── Type icon ── */
.type-icon { width: 40px; height: 40px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* ── Review card (Revisão/Aprovação) ── */
.review-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; transition: box-shadow var(--transition-base); }
.review-card:hover { box-shadow: var(--shadow-md); }
.review-col { padding: 18px; }
.review-col-original  { background: var(--surface-low); border-right: 1px solid var(--border); }
.review-col-suggestion{ background: var(--surface); }

/* ── Timeline (Histórico) ── */
.timeline-item { position: relative; padding-left: 56px; }
.timeline-item:not(:last-child)::before {
  content: ''; position: absolute; left: 20px; top: 44px; bottom: -8px;
  width: 2px; background: var(--border);
}
.timeline-dot {
  position: absolute; left: 0; top: 0; width: 40px; height: 40px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  z-index: 1; box-shadow: var(--shadow-sm); transition: transform var(--transition-fast);
}
.timeline-item:hover .timeline-dot { transform: scale(1.1); }
.timeline-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px; margin-bottom: 18px;
  transition: box-shadow var(--transition-base);
}
.timeline-card:hover { box-shadow: var(--shadow-md); }

/* ── Settings card ── */
.settings-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 22px; margin-bottom: 18px;
}
.settings-card h4 { font-size: 15px; font-weight: 700; color: var(--text-primary); margin: 0 0 14px; }

/* ── Safe status panel ── */
.safe-status-panel {
  background: var(--surface-low); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
}
.safe-status-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid var(--border); gap: 12px;
}
.safe-status-row:last-child { border-bottom: none; }
.safe-status-row span { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.safe-status-row b    { font-size: 13px; color: var(--text-primary); font-weight: 700; }

/* ── Trail item card (Trilhas — estilo timeline vertical do Stitch mobile) ── */
.trail-item-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px;
  transition: box-shadow var(--transition-base), transform .15s ease;
  position: relative; z-index: 2;
}
.trail-item-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
/* Linha de conexão entre items da trilha */
.trail-connector {
  position: relative; margin-left: 28px; z-index: 1;
  height: 48px; display: flex; flex-direction: column; align-items: flex-start;
}
.trail-connector-line {
  width: 2px; flex: 1; margin-left: -1px;
}
.trail-connector-line.required     { background: var(--primary); }
.trail-connector-line.complementary{ background: var(--border-strong); background: repeating-linear-gradient(to bottom, var(--border-strong) 0, var(--border-strong) 4px, transparent 4px, transparent 8px); }
.trail-connector-line.optional     { background: repeating-linear-gradient(to bottom, var(--text-muted) 0, var(--text-muted) 3px, transparent 3px, transparent 7px); }
.trail-connector-label {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-full); padding: 2px 10px;
  font-size: 10px; font-weight: 800; letter-spacing: .05em;
  text-transform: uppercase; color: var(--text-muted); white-space: nowrap;
  box-shadow: var(--shadow-xs);
}
.trail-connector-label.required { color: var(--primary); border-color: var(--primary-dim); }

/* ── Debug box ── */
.debug-box {
  background: var(--debug-bg) !important;
  color: var(--debug-text) !important;
  border-radius: var(--radius-md); padding: 16px;
  font-size: 12px; font-family: monospace;
  white-space: pre-wrap; overflow: auto; max-height: 320px;
}

/* ── Skeleton ── */
.skeleton {
  background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-shine) 50%, var(--skeleton-base) 75%);
  background-size: 200% 100%; animation: skeleton-wave 1.4s infinite;
  border-radius: var(--radius-md);
}
@keyframes skeleton-wave { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ── Drop zone (Upload) ── */
.drop-zone {
  border: 2px dashed var(--border); border-radius: var(--radius-lg);
  background: var(--surface);
  min-height: 280px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 24px; text-align: center;
  transition: border-color var(--transition-fast), background var(--transition-fast);
  cursor: pointer;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--primary);
  background: var(--primary-container);
}
.drop-zone-icon {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--primary-container);
  display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
  transition: transform var(--transition-base);
}
.drop-zone:hover .drop-zone-icon { transform: scale(1.08); }
.drop-zone-icon .material-symbols-outlined { font-size: 34px; color: var(--primary); }

/* ── Spinner ── */
.spinner {
  width: 20px; height: 20px;
  border: 2.5px solid rgba(0,74,198,.2); border-top-color: var(--primary);
  border-radius: 50%; animation: spin .7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg) } }

/* ── Modal ── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5); backdrop-filter: blur(6px);
  z-index: 1000; display: flex; align-items: center; justify-content: center;
  padding: 16px; animation: fadeIn .2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-box {
  background: var(--modal-bg);
  border-radius: var(--radius-xl); border: 1px solid var(--modal-border);
  width: 100%; max-width: 500px; max-height: 90dvh; overflow-y: auto;
  animation: modalIn .2s cubic-bezier(.34,1.56,.64,1);
  box-shadow: var(--shadow-xl);
}
@keyframes modalIn { from { opacity:0; transform: scale(.95); } to { opacity:1; transform: scale(1); } }

/* ── Toast ── */
#toast-container {
  position: fixed;
  bottom: calc(var(--bottomnav-height) + var(--safe-bottom) + 12px);
  left: 50%; transform: translateX(-50%);
  z-index: 9999; display: flex; flex-direction: column; gap: 8px;
  align-items: center; pointer-events: none;
}
.toast {
  pointer-events: all;
  padding: 12px 20px; border-radius: var(--radius-full); font-size: 14px; font-weight: 600;
  color: #eff1f3; background: #2d3133;
  box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 8px;
  animation: toastIn .25s cubic-bezier(.34,1.56,.64,1);
  transition: opacity .3s;
}
.toast.success { background: #1a6b3c; }
.toast.error   { background: #ba1a1a; }
@keyframes toastIn { from { opacity:0; transform: translateY(12px) scale(.95); } to { opacity:1; transform: translateY(0) scale(1); } }

/* ── Dark mode toggle ── */
.theme-toggle { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
.theme-toggle input { opacity: 0; width: 0; height: 0; }
.theme-toggle-track {
  position: absolute; inset: 0;
  background: var(--toggle-track); border-radius: 100px; cursor: pointer; transition: background .2s;
}
.theme-toggle-track::after {
  content: ''; position: absolute; left: 3px; top: 3px;
  width: 18px; height: 18px; background: var(--toggle-thumb); border-radius: 50%;
  transition: transform .2s; box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
html.dark .theme-toggle-track::after { transform: translateX(18px); }

/* ── Focus ring acessível ── */
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
</style>
