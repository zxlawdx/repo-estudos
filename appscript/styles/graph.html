<style>
/* ============================================================
   styles/graph.html v2 — Setas direcionais, legenda, mobile-first
   ============================================================ */

/* ---- Layout principal (desktop 2 colunas) ---- */
.graph-shell, .relation-shell, .admin-shell {
  display: grid;
  grid-template-columns: minmax(0,1fr) 300px;
  gap: 16px;
  align-items: start;
}
.graph-card, .relation-card, .admin-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: 0 10px 34px rgba(25,28,30,.05);
}
.graph-toolbar, .relation-toolbar, .admin-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px;
  border-bottom: 1px solid #e0e3e5;
}

/* ---- Viewport do grafo ---- */
.obs-graph-viewport {
  position: relative;
  min-height: 540px;
  height: min(70dvh, 720px);
  overflow: hidden;
  background:
    radial-gradient(circle at 20px 20px, var(--graph-viewport-bg1) 1.2px, transparent 1.2px),
    linear-gradient(180deg,var(--graph-viewport-bg2) 0%,var(--graph-viewport-bg3) 100%);
  background-size: 28px 28px, 100% 100%;
  border-radius: 0 0 18px 18px;
  touch-action: none; /* permite pan/zoom pelo JS */
  user-select: none;
}
.obs-graph-svg {
  width: 100%; height: 100%; display: block;
  cursor: grab;
  -webkit-tap-highlight-color: transparent;
}
.obs-graph-svg:active { cursor: grabbing; }

/* ---- Setas (markers) ---- */
.obs-arrow-fill         { fill: var(--obs-arrow-fill); }
.obs-arrow-fill-hover   { fill: var(--primary); }
.obs-arrow-fill-selected{ fill: var(--primary); }

/* ---- Arestas ---- */
.obs-edge {
  fill: none; stroke: var(--obs-edge-stroke); stroke-width: 1.8; opacity: .75;
  transition: stroke-width .12s, opacity .12s;
}
.obs-edge-hit {
  fill: none; stroke: transparent; stroke-width: 14;
  cursor: pointer;
}
.obs-edge-wrap:hover .obs-edge { stroke: var(--primary); stroke-width: 2.8; opacity: 1; }
.obs-edge-selected { stroke: var(--primary) !important; stroke-width: 3 !important; opacity: 1 !important; }

/* Cores por tipo de relação */
.obs-rel-prerequisite,
.obs-rel-depends_on,
.obs-rel-required    { stroke: #004ac6; }
.obs-rel-recommended_after,
.obs-rel-recommended { stroke: #006d3a; stroke-dasharray: none; }
.obs-rel-related,
.obs-rel-complementary { stroke: #737686; stroke-dasharray: 6 4; }
.obs-rel-criticizes  { stroke: #ba1a1a; stroke-dasharray: 8 4; }
.obs-rel-explains,
.obs-rel-part_of     { stroke: #2563eb; }
.obs-rel-same_author,
.obs-rel-same_category,
.obs-rel-same_subject { stroke: #6d4aff; stroke-dasharray: 4 4; }
.obs-rel-custom      { stroke: #943700; }

/* ---- Nós ---- */
.obs-node { cursor: pointer; outline: none; }
.obs-node circle {
  fill: var(--surface); stroke: var(--text-muted); stroke-width: 2;
  filter: drop-shadow(0 6px 10px rgba(25,28,30,.13));
  transition: transform .15s ease, stroke-width .15s ease;
}
.obs-node:hover circle,
.obs-node:focus circle { stroke-width: 3.5; transform: scale(1.07); }
.obs-node.selected circle { stroke-width: 4; transform: scale(1.09); }
.obs-node-material circle { stroke: #004ac6; fill: #eef3ff; }
.obs-node-path     circle { stroke: #943700; fill: #ffede6; }
.obs-node-category circle { stroke: #505f76; fill: #f2f4f6; }
.obs-node-subject  circle { stroke: #006d3a; fill: #effaf2; }
.obs-node-tag      circle { stroke: #7d2d00; fill: #fff5ef; }
.obs-node-topic    circle { stroke: #6d4aff; fill: #f4f0ff; }
.obs-node-icon  { font-family:'Material Symbols Outlined'; font-size:20px; fill:#191c1e; pointer-events:none; }
.obs-node-label { font:700 10.5px/1.2 Inter,Arial,sans-serif; fill:#191c1e; paint-order:stroke; stroke:rgba(255,255,255,.92); stroke-width:4px; stroke-linejoin:round; pointer-events:none; }
.obs-node.selected .obs-node-label { fill:#004ac6; }

/* ---- Painéis laterais ---- */
.graph-side-panel, .relation-side-panel, .admin-side-panel {
  min-height:100%; padding:14px; overflow:auto;
  max-height: calc(100dvh - 160px);
}

/* ---- Filtros do grafo ---- */
.graph-filter-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.graph-filter-pill {
  display:flex; align-items:center; gap:7px; min-height:38px;
  padding:8px 10px; border:1px solid #c3c6d7; border-radius:999px;
  font-size:12px; color:#434655; background:#fff; cursor:pointer;
  user-select:none;
}
.graph-filter-pill:hover { background:#f2f4f6; }
.graph-filter-pill input { accent-color:#004ac6; width:16px; height:16px; cursor:pointer; flex-shrink:0; }

/* ---- Legenda do grafo ---- */
.graph-legend {
  padding: 8px 12px;
  border-top: 1px solid #e0e3e5;
  background: rgba(var(--surface-low), .92);
}
.graph-legend-inner {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  font-size: 12px; color: var(--text-secondary);
}
.graph-legend-item {
  display: inline-flex; align-items: center; gap: 5px;
}

/* ---- Controles flutuantes do grafo (mobile-first) ---- */
.graph-float-controls {
  position: absolute; bottom: 10px; right: 10px;
  display: flex; flex-direction: column; gap: 6px; z-index: 10;
}
.graph-float-controls button {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,.95);
  border: 1px solid #c3c6d7;
  box-shadow: 0 4px 14px rgba(0,0,0,.14);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 20px; color: var(--text-primary);
  transition: background .14s, transform .14s;
  -webkit-tap-highlight-color: transparent;
}
.graph-float-controls button:active { background: var(--primary-container); transform: scale(.92); }
.graph-float-controls button .material-symbols-outlined { font-size: 20px; }

/* ---- Detalhes (painel lateral / bottom sheet) ---- */
.graph-details-title { font-size:17px; font-weight:800; color:var(--text-primary); margin:0 0 6px; word-break:break-word; }
.graph-meta-list { display:flex; flex-direction:column; gap:8px; margin:12px 0; }
.graph-meta-row { display:flex; justify-content:space-between; gap:12px; font-size:12px; border-bottom:1px dashed #e0e3e5; padding-bottom:6px; }
.graph-meta-row b { color:var(--text-secondary); }
.graph-edge-detail {
  background:var(--surface-low); border:1px solid var(--primary-dim); border-radius:14px; padding:14px;
}
.graph-edge-arrow {
  display:flex; align-items:center; gap:8px; margin:10px 0;
  font-size:13px; font-weight:700; color:#191c1e;
}
.graph-edge-arrow-icon { color:#004ac6; font-size:20px; }

/* ---- Relações ---- */
.relation-list { display:flex; flex-direction:column; gap:10px; }
.relation-item {
  border:1px solid var(--border); background:var(--surface); border-radius:14px; padding:12px;
}
.relation-item-main { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.relation-arrow { color:#004ac6; font-weight:800; white-space:nowrap; }
.entity-result {
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  border:1px solid #e0e3e5; background:#fff; border-radius:12px; padding:9px 10px; cursor:pointer;
}
.entity-result:hover { background:var(--surface-low); border-color:var(--primary-dim); }
.entity-result.selected { background:var(--primary-container); border-color:var(--primary); }
.entity-selected-box {
  min-height:44px; border:1px solid var(--primary-dim); background:var(--primary-container);
  border-radius:12px; padding:10px 12px; font-size:13px; color:var(--on-primary-container);
}

/* ---- Trilha: abas ---- */
.trail-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 16px; }
.trail-tab-btn {
  border:1px solid var(--border); background:var(--surface); color:var(--text-secondary);
  padding:9px 14px; border-radius:999px; font-weight:800; font-size:13px;
  display:inline-flex; align-items:center; gap:6px;
  transition: background .12s;
}
.trail-tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.trail-tab-btn:hover:not(.active) { background:var(--surface-low); }

/* ---- Admin user cards ---- */
.admin-user-card { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; border:1px solid var(--border); border-radius:14px; padding:12px; }
.admin-user-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
.admin-user-actions select { min-width:112px; }

/* ---- Permissão negada ---- */
.permission-denied {
  border:1px solid var(--error-container); background:var(--surface-low); border-radius:18px; padding:32px 24px; text-align:center;
}

/* ---- more-actions menu ---- */
/* ---- Bottom sheet "Mais opções" no mobile ---- */

/* Backdrop */
.item-sheet-backdrop {
  display: none;
  position: fixed; inset: 0; z-index: 998;
  background: rgba(0,0,0,.45);
}
.item-sheet-backdrop.open { display: block; }

/* Sheet */
.item-sheet {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 999;
  background: var(--modal-bg);
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -8px 40px rgba(0,0,0,.22);
  padding: 0 0 calc(16px + env(safe-area-inset-bottom));
  max-height: 80dvh;
  overflow-y: auto;
}
.item-sheet.open { display: block; }

.item-sheet-handle {
  width: 40px; height: 4px;
  background: var(--border); border-radius: 4px;
  margin: 12px auto 4px;
}
.item-sheet-title {
  font-size: 14px; font-weight: 700;
  color: var(--text-primary);
  padding: 8px 18px 14px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.item-sheet-actions {
  display: flex; flex-direction: column; padding: 8px 12px;
}
.item-sheet-actions button,
.item-sheet-actions a {
  width: 100%;
  min-height: 50px;
  border-radius: 12px !important;
  margin: 4px 0;
  font-size: 15px !important;
  justify-content: flex-start !important;
  padding: 12px 16px !important;
  text-decoration: none;
  display: flex; align-items: center; gap: 10px;
}
.item-sheet-actions .material-symbols-outlined { font-size: 20px; }

/* O botão gatilho */
.path-list-actions-mobile { display: none; }
.path-list-actions-mobile > button {
  width: 100%; justify-content: center; border-radius: 12px !important;
  min-height: 44px; font-size: 14px !important;
}

/* more-actions-menu não é mais usado no mobile, manter só para fallback desktop */
.more-actions-menu {
  position: absolute; right: 0; top: 42px; min-width: 200px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 16px 40px rgba(0,0,0,.18); padding: 8px; z-index: 30;
}
.more-actions-menu button, .more-actions-menu select { width:100%; margin:4px 0; }

/* ---- Mobile bottom sheet genérico ---- */
.graph-bottom-sheet {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 60;
  background: var(--modal-bg);
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -8px 40px rgba(0,0,0,.18);
  max-height: 72dvh;
  overflow-y: auto;
  padding: 16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  transition: transform .22s ease;
}
.graph-bottom-sheet.open { display: block; }
.graph-bs-handle {
  width: 40px; height: 4px;
  background: var(--border); border-radius: 4px;
  margin: 0 auto 14px;
}
.graph-bs-close {
  position: absolute; top: 12px; right: 12px;
  background: var(--surface-low); border: none; border-radius: 50%;
  width: 32px; height: 32px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ====================================================
   BREAKPOINTS
   ==================================================== */
@media (max-width: 900px) {
  .graph-shell, .relation-shell, .admin-shell { grid-template-columns: 1fr; }
  .graph-side-panel, .relation-side-panel, .admin-side-panel { max-height: none; }
}

@media (max-width: 640px) {
  .obs-graph-viewport {
    min-height: 440px;
    height: calc(100dvh - 200px);
    border-radius: 14px;
  }
  .graph-card { border-radius: 14px; }
  .graph-toolbar { flex-direction: column; align-items: stretch; }
  .graph-toolbar > * { width: 100%; }
  .graph-filter-grid { grid-template-columns: 1fr; }
  .graph-float-controls { bottom: 8px; right: 8px; }
  .graph-float-controls button { width: 48px; height: 48px; }
  .trail-tabs { display: grid; grid-template-columns: repeat(3,1fr); }
  .trail-tab-btn { justify-content: center; padding: 10px 6px; font-size: 12px; }
  .path-item-row { flex-direction: column; }
  .path-item-row .file-card-actions { display: none !important; }
  .path-list-actions-mobile { display: block; position: relative; margin-top: 12px; }
  .path-list-actions-mobile > button { width: 100%; justify-content: center; }
  .relation-item-main, .admin-user-card { display: block; }
  .admin-user-actions { justify-content: flex-start; margin-top: 10px; }
  .admin-user-actions select, .admin-user-actions button { width: 100%; }
  /* Em mobile, painel lateral do grafo vira seção abaixo */
  .graph-side-panel { padding: 10px; }
  .graph-legend-inner { gap: 10px; font-size: 11px; }
}

/* ---- Dark mode: ajuste de nós e arestas ---- */
html.dark .obs-node-material circle { stroke: #79b8ff; fill: #1e3a5f; }
html.dark .obs-node-path     circle { stroke: #ffa657; fill: #4a2209; }
html.dark .obs-node-category circle { stroke: #adbac7; fill: #2d333b; }
html.dark .obs-node-subject  circle { stroke: #56d364; fill: #0d3320; }
html.dark .obs-node-tag      circle { stroke: #ffb77c; fill: #3d1a00; }
html.dark .obs-node-topic    circle { stroke: #b392f0; fill: #2b1e5a; }
html.dark .obs-node circle { filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
html.dark .graph-float-controls button {
  background: rgba(28,33,40,.95);
  border-color: var(--border);
  color: var(--text-primary);
  box-shadow: 0 4px 14px rgba(0,0,0,.4);
}
html.dark .obs-rel-prerequisite,
html.dark .obs-rel-depends_on,
html.dark .obs-rel-required    { stroke: #79b8ff; }
html.dark .obs-rel-recommended_after,
html.dark .obs-rel-recommended { stroke: #56d364; }
html.dark .obs-rel-criticizes  { stroke: #f97583; }
html.dark .obs-rel-explains,
html.dark .obs-rel-part_of     { stroke: #9ecbff; }
html.dark .obs-rel-same_author,
html.dark .obs-rel-same_category,
html.dark .obs-rel-same_subject { stroke: #b392f0; }
html.dark .obs-rel-custom      { stroke: #ffa657; }


html.dark .item-sheet { background: var(--modal-bg) !important; }
html.dark .item-sheet-title { color: var(--text-primary) !important; border-color: var(--border) !important; }

/* ── Grafo v3: adições ────────────────────────── */

/* Anel de nó expandido */
.obs-node-expanded-ring {
  fill: none;
  stroke: var(--primary);
  stroke-width: 2.5;
  stroke-dasharray: 6 4;
  opacity: .7;
  animation: spin-slow 8s linear infinite;
}
@keyframes spin-slow { to { transform: rotate(360deg); } }

/* Badge de contagem no nó de trilha */
.obs-node-badge {
  font: 700 9px Inter, Arial, sans-serif;
  fill: #fff;
  background: var(--primary);
}

/* Aresta temporária (modo criar relação) */
.obs-edge-creating {
  fill: none;
  stroke: var(--primary);
  stroke-width: 2.5;
  stroke-dasharray: 8 5;
  opacity: .85;
  pointer-events: none;
}

/* Nó origem da relação sendo criada */
.obs-node.creating-src circle {
  stroke: var(--primary) !important;
  stroke-width: 4 !important;
  fill: var(--primary-container) !important;
}

/* Aresta gerada automaticamente: mais tênue */
.obs-edge-generated {
  opacity: .4;
  stroke-dasharray: 4 4;
}

/* Filtro de trilha */
#pathFilterWrap .graph-filter-grid {
  grid-template-columns: 1fr;
}

/* Tooltip hover nos nós (via title melhorado) */
.obs-node:focus { outline: 2px solid var(--primary); outline-offset: 4px; }



/* ============================================================
   v22 — polimento visual e dark mode consistente para grafos/relações
   ============================================================ */
.graph-card, .relation-card, .admin-card,
.graph-side-panel, .relation-side-panel, .admin-side-panel {
  background: var(--surface) !important;
  color: var(--text-primary) !important;
  border-color: var(--border) !important;
  box-shadow: var(--shadow-sm);
}
.graph-toolbar, .relation-toolbar, .admin-toolbar {
  background: color-mix(in srgb, var(--surface) 94%, var(--primary) 6%);
  border-bottom-color: var(--border) !important;
  border-radius: 18px 18px 0 0;
}
.obs-graph-viewport {
  border: 1px solid transparent;
  border-top: 0;
}
.graph-filter-pill,
.entity-result,
.relation-item,
.more-actions-menu {
  background: var(--surface-low) !important;
  color: var(--text-secondary) !important;
  border-color: var(--border) !important;
}
.graph-filter-pill:hover,
.entity-result:hover {
  background: var(--surface-high) !important;
  color: var(--primary) !important;
  border-color: var(--primary-dim) !important;
}
.graph-filter-pill input { accent-color: var(--primary); }
.graph-legend {
  background: color-mix(in srgb, var(--surface-low) 90%, transparent) !important;
  border-top-color: var(--border) !important;
}
.graph-meta-row { border-bottom-color: var(--border) !important; }
.graph-edge-arrow { color: var(--text-primary) !important; }
.graph-edge-arrow-icon, .relation-arrow { color: var(--primary) !important; }
.entity-selected-box {
  background: var(--primary-container) !important;
  color: var(--on-primary-container) !important;
  border-color: var(--primary-dim) !important;
}
html.dark .graph-card, html.dark .relation-card, html.dark .admin-card,
html.dark .graph-side-panel, html.dark .relation-side-panel, html.dark .admin-side-panel {
  background: var(--surface) !important;
  color: var(--text-primary) !important;
  border-color: var(--border) !important;
}
html.dark .graph-toolbar, html.dark .relation-toolbar, html.dark .admin-toolbar {
  background: color-mix(in srgb, var(--surface) 88%, var(--primary) 12%) !important;
}
html.dark .obs-graph-viewport {
  background:
    radial-gradient(circle at 20px 20px, rgba(121,184,255,.10) 1.2px, transparent 1.2px),
    linear-gradient(180deg, #0e1117 0%, #0d1117 100%) !important;
  background-size: 28px 28px, 100% 100% !important;
}
html.dark .obs-node-label {
  fill: var(--text-primary) !important;
  stroke: rgba(14,17,23,.88) !important;
}
html.dark .obs-node-icon { fill: var(--text-primary) !important; }
html.dark .obs-node.selected .obs-node-label { fill: var(--primary) !important; }
html.dark .graph-filter-pill,
html.dark .entity-result,
html.dark .relation-item,
html.dark .more-actions-menu {
  background: var(--surface-low) !important;
  color: var(--text-secondary) !important;
  border-color: var(--border) !important;
}
html.dark .graph-filter-pill:hover,
html.dark .entity-result:hover {
  background: var(--surface-high) !important;
  color: var(--primary) !important;
}
html.dark .graph-legend { background: var(--surface-low) !important; }

</style>
