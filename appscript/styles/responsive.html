<style>
/* ============================================================
   RESPONSIVE — 360 · 390 · 768 · 1024 · 1280+
   ============================================================ */

/* ---- Filters: accordion/chips em mobile ---- */
.filter-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  background: #f2f4f6;
  border: 1px solid #c3c6d7;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 20px;
}
.filter-select {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.filter-select label {
  font-size: 10px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: #737686;
}
.filter-select select {
  background: #ffffff;
  border: 1px solid #c3c6d7;
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 13px;
  color: #191c1e;
  cursor: pointer;
  outline: none;
  transition: box-shadow .15s;
  width: 100%;
}
.filter-select select:focus { box-shadow: 0 0 0 2px #004ac6; border-color: #004ac6; }

/* Chips horizontais (mobile filter row) */
.chips-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
  margin-bottom: 16px;
}
.chips-row::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 100px;
  font-size: 12px; font-weight: 600;
  border: 1px solid #c3c6d7;
  background: #ffffff;
  color: #434655;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  display: flex; align-items: center; gap: 4px;
}
.filter-chip:hover { background: #f2f4f6; }
.filter-chip.active {
  background: #004ac6;
  border-color: #004ac6;
  color: #ffffff;
}

/* Accordion filter (xs screens) */
.filter-accordion {
  background: #ffffff;
  border: 1px solid #c3c6d7;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 16px;
}
.filter-accordion-header {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  font-size: 14px; font-weight: 600; color: #191c1e;
}
.filter-accordion-header .material-symbols-outlined {
  transition: transform .2s;
}
.filter-accordion-header.open .material-symbols-outlined { transform: rotate(180deg); }
.filter-accordion-body {
  display: none;
  padding: 0 16px 16px;
  border-top: 1px solid #c3c6d7;
}
.filter-accordion-body.open { display: block; }

/* ---- Tables → cards on mobile ---- */
@media (max-width: 639px) {
  .table-to-cards table  { display: none !important; }
  .table-to-cards .card-fallback { display: block !important; }
  .table-to-cards .card-fallback { display: flex !important; }
}
@media (min-width: 640px) {
  .table-to-cards .card-fallback { display: none !important; }
}

/* ---- Bento Grid adjustments ---- */
@media (max-width: 479px) {
  .bento-grid { grid-template-columns: 1fr; }
}
@media (min-width: 480px) and (max-width: 767px) {
  .bento-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ---- Review card: stack on mobile ---- */
@media (max-width: 767px) {
  .review-card-grid { flex-direction: column !important; }
  .review-col-original { border-right: none; border-bottom: 1px solid #c3c6d7; }
}

/* ---- Modais caber na tela ---- */
@media (max-width: 479px) {
  .modal-box {
    border-radius: 20px 20px 0 0;
    max-height: 90dvh;
    margin: auto 0 0 0;
    align-self: flex-end;
  }
  .modal-backdrop { align-items: flex-end; padding: 0; }
}

/* ---- Float action button ---- */
.fab {
  position: fixed;
  bottom: calc(var(--bottomnav-height) + var(--safe-bottom) + 16px);
  right: 16px;
  width: 56px; height: 56px;
  background: #004ac6;
  color: #ffffff;
  border: none;
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(0,74,198,.35);
  cursor: pointer;
  z-index: 90;
  transition: transform .2s, box-shadow .2s;
}
.fab:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 24px rgba(0,74,198,.45);
}
.fab:active { transform: scale(.95); }
@media (min-width: 768px) {
  .fab { bottom: 24px; }
}

/* ---- Hero section (login) ---- */
@media (max-width: 767px) {
  .login-hero { display: none !important; }
  .login-form-wrap { min-height: 100dvh; }
}

/* ---- Graph canvas ---- */
.graph-canvas {
  position: relative;
  overflow: hidden;
  background-color: #f7f9fb;
  background-image: radial-gradient(#c3c6d7 1px, transparent 1px);
  background-size: 24px 24px;
  min-height: 480px;
  touch-action: pan-x pan-y;
}
@media (max-width: 767px) {
  .graph-canvas { min-height: 360px; }
}

/* ---- Trail list (mobile) ---- */
.trail-connector {
  width: 2px;
  margin: 0 auto;
  position: relative;
}
.trail-connector-line {
  width: 2px;
  background: #004ac6;
  height: 48px;
  margin: 0 auto;
}
.trail-connector-line.dashed {
  background: none;
  border-left: 2px dashed #737686;
}
.trail-connector-label {
  position: absolute;
  top: 50%;
  left: 12px;
  transform: translateY(-50%);
  background: #ffffff;
  border: 1px solid #c3c6d7;
  border-radius: 100px;
  padding: 2px 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  white-space: nowrap;
  color: #434655;
}

/* ---- Upload drop zone ---- */
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 16px;
  padding: 48px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  background: var(--surface);
  min-height: 240px;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--primary);
  background: var(--primary-container);
}
.drop-zone-icon {
  width: 72px; height: 72px;
  background: var(--primary-container);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
  transition: transform .2s;
}
.drop-zone:hover .drop-zone-icon { transform: scale(1.08); }
.drop-zone-icon .material-symbols-outlined { font-size: 32px; color: var(--primary); }

/* ---- Section divider (safe area) ---- */
.safe-bottom-pad {
  height: calc(var(--bottomnav-height) + var(--safe-bottom));
}
@media (min-width: 768px) {
  .safe-bottom-pad { height: 32px; }
}

.shell-avatar {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--primary-container);
  color: var(--primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  overflow: hidden;
  flex-shrink: 0;
}
.shell-avatar-sm { width: 32px; height: 32px; border-radius: 999px; }
.sidebar-user {
  margin: 8px 14px 14px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 14px;
  display: flex;
  gap: 10px;
  align-items: center;
  cursor: pointer;
  background: var(--surface-low);
}
.sidebar-user strong { display:block;font-size:13px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:145px; }
.sidebar-user span#sidebarUserRole { display:block;font-size:11px;color:var(--text-muted);margin-top:1px; }
@media (max-width: 390px) {
  .btn-primary, .btn-secondary, .btn-danger { min-height: 42px; }
}

</style>

<style>
/* ============================================================
   DARK MODE — Overrides globais
   Cobre casos que ficam via style inline ou outros arquivos.
   ============================================================ */

/* Forçar fundo geral */
html.dark body { background: var(--bg) !important; color: var(--text-primary) !important; }

/* Inputs e selects */
html.dark input,
html.dark select,
html.dark textarea {
  background: var(--input-bg) !important;
  color: var(--input-text) !important;
  border-color: var(--input-border) !important;
}
html.dark input::placeholder,
html.dark textarea::placeholder { color: var(--input-placeholder) !important; }

/* Topbar search */
html.dark .topbar-search input { background: var(--input-search-bg) !important; }

/* Qualquer card/section inline com bg branco */
html.dark [style*="background:#fff"],
html.dark [style*="background: #fff"],
html.dark [style*="background:#ffffff"],
html.dark [style*="background: #ffffff"] {
  background: var(--surface) !important;
}
html.dark [style*="background:#f2f4f6"],
html.dark [style*="background: #f2f4f6"] {
  background: var(--surface-low) !important;
}
html.dark [style*="background:#f7f9fb"],
html.dark [style*="background: #f7f9fb"] {
  background: var(--bg) !important;
}

/* Texto inline hardcoded */
html.dark [style*="color:#191c1e"],
html.dark [style*="color: #191c1e"] { color: var(--text-primary) !important; }
html.dark [style*="color:#434655"],
html.dark [style*="color: #434655"] { color: var(--text-secondary) !important; }
html.dark [style*="color:#737686"],
html.dark [style*="color: #737686"] { color: var(--text-muted) !important; }

/* Bordas inline */
html.dark [style*="border:1px solid #c3c6d7"],
html.dark [style*="border: 1px solid #c3c6d7"],
html.dark [style*="border:1px solid #e0e3e5"],
html.dark [style*="border: 1px solid #e0e3e5"] {
  border-color: var(--border) !important;
}

/* Topbar / bottomnav / sidebar */
html.dark .topbar      { background: var(--topbar-bg) !important; border-color: var(--border) !important; }

/* Bottom sheets */

/* pre / code */

/* Skeleton no dark */

  background-size: 200% 100% !important;
}

/* Scrollbar no dark */

/* Login hero */

/* Leitor */
