<!-- Modal: Confirmar exclusão -->
<div id="modalConfirm" class="modal-backdrop" style="display:none">
  <div class="modal-box" style="max-width:400px">
    <div style="padding:20px 24px;text-align:center">
      <div style="width:56px;height:56px;background:#ffdad6;border-radius:50%;
           display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
        <span class="material-symbols-outlined" style="font-size:28px;color:#ba1a1a">warning</span>
      </div>
      <h3 id="confirmTitle" style="font-size:18px;font-weight:700;color:var(--text-primary);margin:0 0 8px">Confirmar ação</h3>
      <p id="confirmMsg" style="font-size:14px;color:var(--text-secondary);margin:0 0 20px">Tem certeza?</p>
      <div style="display:flex;gap:10px">
        <button onclick="closeModal('modalConfirm')" class="btn-secondary" style="flex:1;padding:12px;border-radius:12px">
          Cancelar
        </button>
        <button id="confirmBtn" class="btn-danger" style="flex:1;padding:12px;border-radius:12px;border:none">
          Confirmar
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Visualização rápida de arquivo -->
<div id="modalPreview" class="modal-backdrop" style="display:none">
  <div class="modal-box" style="max-width:700px;max-height:90dvh">
    <div style="padding:14px 18px;border-bottom:1px solid var(--border);
         display:flex;align-items:center;justify-content:space-between">
      <h3 id="previewModalTitle" style="font-size:15px;font-weight:600;margin:0;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80%"></h3>
      <div style="display:flex;gap:6px">
        <a id="previewModalLink" href="#" target="_blank" class="btn-secondary"
           style="padding:6px 10px;border-radius:8px;text-decoration:none;font-size:12px;display:flex;align-items:center;gap:4px">
          <span class="material-symbols-outlined" style="font-size:16px">open_in_new</span>
        </a>
        <button onclick="closeModal('modalPreview')" class="btn-secondary" style="padding:6px;border:none;border-radius:8px">
          <span class="material-symbols-outlined" style="font-size:20px">close</span>
        </button>
      </div>
    </div>
    <iframe id="previewModalFrame" style="width:100%;height:480px;border:none" loading="lazy"
      sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
  </div>
</div>

<!-- Modal: Notificação de sucesso (global) -->
<div id="modalSuccess" class="modal-backdrop" style="display:none">
  <div class="modal-box" style="max-width:360px">
    <div style="padding:28px 24px;text-align:center">
      <div style="width:60px;height:60px;background:#d1fae5;border-radius:50%;
           display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
           animation:successPop .4s cubic-bezier(.34,1.56,.64,1)">
        <span class="material-symbols-outlined icon-fill" style="font-size:30px;color:#065f46">check_circle</span>
      </div>
      <h3 id="successTitle" style="font-size:18px;font-weight:700;color:var(--text-primary);margin:0 0 8px"></h3>
      <p id="successMsg"   style="font-size:14px;color:var(--text-secondary);margin:0 0 20px"></p>
      <button onclick="closeModal('modalSuccess')" class="btn-primary" style="width:100%;padding:12px;border-radius:12px">
        Fechar
      </button>
    </div>
  </div>
</div>
<style>
@keyframes successPop {
  from { transform: scale(0); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
</style>

<script>
/* ---- Helpers globais para modais ---- */

/**
 * Abre modal de confirmação genérico
 * @param {string} title
 * @param {string} msg
 * @param {function} onConfirm
 */
function confirmModal(title, msg, onConfirm) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent   = msg;
  var btn = document.getElementById('confirmBtn');
  btn.onclick = function() { closeModal('modalConfirm'); onConfirm(); };
  openModal('modalConfirm');
}

/**
 * Abre preview rápido via Drive iframe
 * @param {string} title
 * @param {string} previewUrl
 * @param {string} webUrl
 */
function openPreview(title, previewUrl, webUrl) {
  document.getElementById('previewModalTitle').textContent = title;
  document.getElementById('previewModalFrame').src = previewUrl;
  if (webUrl) document.getElementById('previewModalLink').href = webUrl;
  openModal('modalPreview');
}

/**
 * Fecha preview e limpa iframe
 */
function closePreview() {
  document.getElementById('previewModalFrame').src = '';
  closeModal('modalPreview');
}

/**
 * Exibe modal de sucesso
 */
function showSuccessModal(title, msg) {
  document.getElementById('successTitle').textContent = title;
  document.getElementById('successMsg').textContent   = msg;
  openModal('modalSuccess');
}
</script>
